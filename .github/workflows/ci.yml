name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The desktop shell's Electron binary is ~100 MB and nothing here runs it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build web (PWA)
        run: pnpm --filter @cuepoint/web build
      - name: Build web (desktop static export)
        run: pnpm --filter @cuepoint/web build:desktop
