name: Deploy sync worker

# Deploys apps/sync-worker to Cloudflare. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# Run it from the Actions tab ("Run workflow"); it also redeploys whenever
# the worker's code changes on this branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/clever-dijkstra-ij3g5v, main]
    paths: ["apps/sync-worker/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: apps/sync-worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
