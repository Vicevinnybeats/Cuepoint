name: Deploy sync worker

# Deploys apps/sync-worker to Cloudflare. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# Run it from the Actions tab ("Run workflow"); it also redeploys whenever
# the worker's code changes on this branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/clever-dijkstra-ij3g5v, main]
    paths: ["apps/sync-worker/**", ".github/workflows/deploy-sync-worker.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Until the secrets are added this is a no-op rather than a red X on
      # every push that touches the worker.
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy. See README → Manual steps."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy
        working-directory: apps/sync-worker
        run: pnpm exec wrangler deploy
